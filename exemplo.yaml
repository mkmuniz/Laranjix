# Configuracao de exemplo. Rode com:
#   laranjix generate-population --config exemplo.yaml
#
# Mesma seed + mesma config = mesmo dataset, byte a byte.
seed: 42
difficulty: medium
formats: [parquet, csv]
output_dir: out

population:
  accounts: 50000
  reference_date: 2026-01-01
  max_keys_per_account: 5
  # institutions: 12   # descomente para sobrescrever a calibracao
