name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Nao bloqueia o build: antes da 1.0 e esperado que haja parametro sem
      # fundamento externo. Bloqueia a release, e aqui fica visivel no log.
      - name: Proveniencia dos parametros de calibracao
        run: laranjix calibration

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=laranjix --cov-report=term-missing

  certificate:
    name: Certificado de qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[bench]"
      # Os dois caminhos sao certificados: so a populacao e o dataset completo.
      # Certificar so a populacao foi como um bug passou -- o `certify` reprovava
      # qualquer dataset que tivesse transacoes, e o CI nunca via.
      - name: Certifica a populacao
        run: |
          laranjix generate-population -n 50000 --seed 42 -o populacao
          laranjix certify populacao --show
      - name: Certifica o dataset completo
        run: |
          laranjix generate -n 20000 --seed 42 --difficulty hard -o out
          laranjix certify out --show
      - name: Publica o certificado como artefato
        uses: actions/upload-artifact@v7
        with:
          name: certificado-do-dataset
          path: |
            out/certificate.md
            out/certificate.json
            out/manifest.json

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # Leva alguns minutos: roda no push para main, no agendamento e sob demanda,
    # nao em todo pull request.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[bench]"
      - name: Treina os modelos de referencia e mede o dataset
        run: laranjix benchmark -n 20000 --seed 11 --runs 3 -o benchmark.md --json benchmark.json
      - name: Publica a tabela no resumo da execucao
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: |
            benchmark.md
            benchmark.json

  reproducibility:
    name: Reprodutibilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Gera o mesmo dataset duas vezes
        run: |
          laranjix generate-population -n 2000 --seed 777 -o run_a
          laranjix generate-population -n 2000 --seed 777 -o run_b
      - name: Compara os arquivos de dados
        run: |
          for table in accounts pix_keys company_partners institutions; do
            cmp "run_a/$table.csv" "run_b/$table.csv"
            cmp "run_a/$table.parquet" "run_b/$table.parquet"
          done
          echo "Mesma seed produziu datasets identicos."
