name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=laranjix --cov-report=term-missing

  reproducibility:
    name: Reprodutibilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Gera o mesmo dataset duas vezes
        run: |
          laranjix generate-population -n 2000 --seed 777 -o run_a
          laranjix generate-population -n 2000 --seed 777 -o run_b
      - name: Compara os arquivos de dados
        run: |
          for table in accounts pix_keys company_partners institutions; do
            cmp "run_a/$table.csv" "run_b/$table.csv"
            cmp "run_a/$table.parquet" "run_b/$table.parquet"
          done
          echo "Mesma seed produziu datasets identicos."
